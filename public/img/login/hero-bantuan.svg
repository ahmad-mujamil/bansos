<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Sky gradient (sore tropis) -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.45" stop-color="#3b82f6"/>
      <stop offset="0.8" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fef3c7" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#fde68a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>

    <!-- Building face -->
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Ground -->
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>

    <!-- Box / aid package -->
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fed7aa"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>

    <!-- Soft cloud filter -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="1200" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1280" cy="380" r="220" fill="url(#sun)"/>
  <circle cx="1280" cy="380" r="90" fill="#fef9c3" opacity="0.95"/>

  <!-- Soft clouds -->
  <g opacity="0.55" filter="url(#soft)">
    <ellipse cx="220" cy="300" rx="180" ry="32" fill="#ffffff"/>
    <ellipse cx="580" cy="240" rx="220" ry="28" fill="#ffffff"/>
    <ellipse cx="980" cy="320" rx="160" ry="26" fill="#ffffff"/>
    <ellipse cx="1450" cy="260" rx="160" ry="24" fill="#ffffff"/>
  </g>

  <!-- Distant mountains -->
  <path d="M0 780 L180 700 L360 740 L520 660 L720 720 L900 640 L1080 700 L1280 660 L1440 720 L1600 690 L1600 900 L0 900 Z"
        fill="#1e40af" opacity="0.55"/>
  <path d="M0 830 L240 760 L480 800 L720 740 L960 800 L1200 760 L1440 800 L1600 770 L1600 950 L0 950 Z"
        fill="#1e3a8a" opacity="0.75"/>

  <!-- Side buildings (left) -->
  <g opacity="0.85">
    <rect x="120" y="620" width="120" height="280" fill="#2563eb"/>
    <rect x="260" y="560" width="100" height="340" fill="#1d4ed8"/>
    <rect x="380" y="640" width="140" height="260" fill="#2563eb"/>
    <!-- Windows -->
    <g fill="#fbbf24" opacity="0.75">
      <rect x="140" y="650" width="14" height="20"/>
      <rect x="170" y="650" width="14" height="20"/>
      <rect x="200" y="650" width="14" height="20"/>
      <rect x="140" y="690" width="14" height="20"/>
      <rect x="170" y="690" width="14" height="20"/>
      <rect x="200" y="690" width="14" height="20"/>
      <rect x="140" y="730" width="14" height="20"/>
      <rect x="170" y="730" width="14" height="20"/>
      <rect x="200" y="730" width="14" height="20"/>

      <rect x="280" y="600" width="14" height="20"/>
      <rect x="310" y="600" width="14" height="20"/>
      <rect x="340" y="600" width="14" height="20"/>
      <rect x="280" y="640" width="14" height="20"/>
      <rect x="310" y="640" width="14" height="20"/>
      <rect x="340" y="640" width="14" height="20"/>
      <rect x="280" y="680" width="14" height="20"/>
      <rect x="310" y="680" width="14" height="20"/>
      <rect x="340" y="680" width="14" height="20"/>

      <rect x="400" y="680" width="14" height="20"/>
      <rect x="430" y="680" width="14" height="20"/>
      <rect x="460" y="680" width="14" height="20"/>
      <rect x="490" y="680" width="14" height="20"/>
      <rect x="400" y="720" width="14" height="20"/>
      <rect x="430" y="720" width="14" height="20"/>
      <rect x="460" y="720" width="14" height="20"/>
      <rect x="490" y="720" width="14" height="20"/>
    </g>
  </g>

  <!-- Side buildings (right) -->
  <g opacity="0.85">
    <rect x="1100" y="640" width="140" height="260" fill="#1d4ed8"/>
    <rect x="1260" y="580" width="120" height="320" fill="#2563eb"/>
    <rect x="1400" y="660" width="120" height="240" fill="#1d4ed8"/>
    <g fill="#fbbf24" opacity="0.75">
      <rect x="1120" y="680" width="14" height="20"/>
      <rect x="1150" y="680" width="14" height="20"/>
      <rect x="1180" y="680" width="14" height="20"/>
      <rect x="1210" y="680" width="14" height="20"/>
      <rect x="1120" y="720" width="14" height="20"/>
      <rect x="1150" y="720" width="14" height="20"/>
      <rect x="1180" y="720" width="14" height="20"/>
      <rect x="1210" y="720" width="14" height="20"/>

      <rect x="1280" y="620" width="14" height="20"/>
      <rect x="1310" y="620" width="14" height="20"/>
      <rect x="1340" y="620" width="14" height="20"/>
      <rect x="1280" y="660" width="14" height="20"/>
      <rect x="1310" y="660" width="14" height="20"/>
      <rect x="1340" y="660" width="14" height="20"/>
      <rect x="1280" y="700" width="14" height="20"/>
      <rect x="1310" y="700" width="14" height="20"/>
      <rect x="1340" y="700" width="14" height="20"/>

      <rect x="1420" y="700" width="14" height="20"/>
      <rect x="1450" y="700" width="14" height="20"/>
      <rect x="1480" y="700" width="14" height="20"/>
      <rect x="1420" y="740" width="14" height="20"/>
      <rect x="1450" y="740" width="14" height="20"/>
      <rect x="1480" y="740" width="14" height="20"/>
    </g>
  </g>

  <!-- Central Government Building -->
  <!-- Plaza pedestal -->
  <rect x="560" y="860" width="480" height="40" fill="#fde68a" opacity="0.95"/>
  <!-- Main facade -->
  <rect x="600" y="500" width="400" height="360" fill="url(#bldg)" stroke="#92400e" stroke-width="2"/>
  <!-- Triangular pediment -->
  <polygon points="580,500 1020,500 800,400" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <polygon points="620,495 1000,495 800,420" fill="#fef3c7"/>
  <!-- Columns -->
  <g fill="#fef9c3" stroke="#92400e" stroke-width="1.5">
    <rect x="630" y="540" width="30" height="320"/>
    <rect x="690" y="540" width="30" height="320"/>
    <rect x="750" y="540" width="30" height="320"/>
    <rect x="820" y="540" width="30" height="320"/>
    <rect x="880" y="540" width="30" height="320"/>
    <rect x="940" y="540" width="30" height="320"/>
  </g>
  <!-- Column capitals -->
  <g fill="#92400e">
    <rect x="624" y="538" width="42" height="6"/>
    <rect x="684" y="538" width="42" height="6"/>
    <rect x="744" y="538" width="42" height="6"/>
    <rect x="814" y="538" width="42" height="6"/>
    <rect x="874" y="538" width="42" height="6"/>
    <rect x="934" y="538" width="42" height="6"/>
  </g>
  <!-- Door -->
  <rect x="780" y="720" width="40" height="140" fill="#92400e"/>
  <rect x="784" y="724" width="32" height="100" fill="#fbbf24" opacity="0.85"/>
  <!-- Steps -->
  <rect x="560" y="900" width="480" height="14" fill="#fde68a"/>
  <rect x="540" y="914" width="520" height="14" fill="#fcd34d"/>
  <rect x="520" y="928" width="560" height="14" fill="#fbbf24"/>

  <!-- Flagpole + Indonesian flag -->
  <line x1="800" y1="400" x2="800" y2="290" stroke="#92400e" stroke-width="4"/>
  <rect x="800" y="290" width="80" height="32" fill="#dc2626"/>
  <rect x="800" y="322" width="80" height="32" fill="#ffffff"/>
  <line x1="802" y1="290" x2="802" y2="354" stroke="#92400e" stroke-width="2" opacity="0.4"/>
  <!-- Flag pole top -->
  <circle cx="800" cy="288" r="5" fill="#fbbf24"/>

  <!-- "Si-Batur" text on building -->
  <text x="800" y="650" font-family="Arial, sans-serif" font-size="36" font-weight="bold"
        text-anchor="middle" fill="#92400e" opacity="0.85">Si-Batur</text>

  <!-- Ground / road -->
  <rect x="0" y="900" width="1600" height="300" fill="url(#ground)"/>
  <!-- Light reflection on road -->
  <ellipse cx="800" cy="950" rx="500" ry="22" fill="#fbbf24" opacity="0.18"/>

  <!-- Decorative street lights -->
  <g stroke="#fde68a" stroke-width="3" fill="#fbbf24" opacity="0.7">
    <line x1="100" y1="900" x2="100" y2="800"/>
    <circle cx="100" cy="795" r="6"/>
    <line x1="1500" y1="900" x2="1500" y2="800"/>
    <circle cx="1500" cy="795" r="6"/>
  </g>

  <!-- ===== Foreground figures: officials handing aid ===== -->

  <!-- Officer 1 (left, government, in batik/uniform) -->
  <g transform="translate(540, 880)">
    <!-- Shadow -->
    <ellipse cx="50" cy="200" rx="60" ry="8" fill="#000000" opacity="0.25"/>
    <!-- Legs (pants) -->
    <rect x="34" y="100" width="14" height="100" fill="#1e293b" rx="4"/>
    <rect x="52" y="100" width="14" height="100" fill="#1e293b" rx="4"/>
    <!-- Shoes -->
    <ellipse cx="40" cy="200" rx="12" ry="5" fill="#0f172a"/>
    <ellipse cx="60" cy="200" rx="12" ry="5" fill="#0f172a"/>
    <!-- Torso (formal shirt - dark blue) -->
    <path d="M14 30 L86 30 L94 110 L6 110 Z" fill="#1d4ed8"/>
    <!-- Batik pattern accents -->
    <g fill="#fbbf24" opacity="0.6">
      <circle cx="30" cy="60" r="4"/>
      <circle cx="50" cy="75" r="3"/>
      <circle cx="70" cy="60" r="4"/>
      <circle cx="40" cy="90" r="3"/>
      <circle cx="60" cy="90" r="3"/>
    </g>
    <!-- ID lanyard -->
    <rect x="46" y="30" width="8" height="40" fill="#dc2626"/>
    <rect x="42" y="68" width="16" height="14" fill="#ffffff" stroke="#dc2626" stroke-width="1"/>
    <!-- Neck -->
    <rect x="42" y="20" width="16" height="14" fill="#f5d6a4"/>
    <!-- Head -->
    <circle cx="50" cy="10" r="20" fill="#f5d6a4"/>
    <!-- Hair -->
    <path d="M30 5 Q50 -15 70 5 L70 -2 Q50 -10 30 -2 Z" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M44 16 Q50 20 56 16" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="44" cy="8" r="1.5" fill="#0f172a"/>
    <circle cx="56" cy="8" r="1.5" fill="#0f172a"/>
    <!-- Right arm extended forward holding box -->
    <path d="M86 40 Q120 55 150 70 L150 90 Q120 75 86 60 Z" fill="#1d4ed8"/>
    <!-- Left arm -->
    <path d="M14 40 Q-4 70 4 100 L18 100 Q14 70 22 50 Z" fill="#1d4ed8"/>
    <!-- Hands -->
    <circle cx="152" cy="80" r="8" fill="#f5d6a4"/>
    <circle cx="6" cy="100" r="7" fill="#f5d6a4"/>
  </g>

  <!-- Aid Box being handed over -->
  <g transform="translate(680, 920)">
    <!-- Box -->
    <rect x="0" y="0" width="120" height="80" fill="url(#box)" stroke="#9a3412" stroke-width="2" rx="4"/>
    <!-- Box flap -->
    <path d="M0 0 L60 -16 L120 0 Z" fill="#fdba74" stroke="#9a3412" stroke-width="2"/>
    <!-- Tape cross -->
    <rect x="55" y="-8" width="10" height="88" fill="#dc2626" opacity="0.85"/>
    <!-- Red Cross / Aid symbol -->
    <g transform="translate(60, 40)">
      <rect x="-3" y="-12" width="6" height="24" fill="#ffffff"/>
      <rect x="-12" y="-3" width="24" height="6" fill="#ffffff"/>
    </g>
    <!-- "BANSOS" text -->
    <text x="60" y="68" font-family="Arial, sans-serif" font-size="11" font-weight="bold"
          text-anchor="middle" fill="#7c2d12">BANTUAN SOSIAL</text>
  </g>

  <!-- Citizen receiving (right side: mother) -->
  <g transform="translate(870, 880)">
    <ellipse cx="50" cy="200" rx="60" ry="8" fill="#000000" opacity="0.25"/>
    <!-- Skirt -->
    <path d="M30 100 L70 100 L80 200 L20 200 Z" fill="#7c3aed"/>
    <!-- Decorative skirt pattern -->
    <g fill="#fbbf24" opacity="0.5">
      <circle cx="35" cy="130" r="3"/>
      <circle cx="50" cy="150" r="3"/>
      <circle cx="65" cy="130" r="3"/>
      <circle cx="40" cy="170" r="3"/>
      <circle cx="60" cy="170" r="3"/>
    </g>
    <!-- Shoes -->
    <ellipse cx="35" cy="200" rx="12" ry="5" fill="#0f172a"/>
    <ellipse cx="65" cy="200" rx="12" ry="5" fill="#0f172a"/>
    <!-- Torso (kebaya-like blouse) -->
    <path d="M16 30 L84 30 L92 100 L8 100 Z" fill="#dc2626"/>
    <!-- Neck -->
    <rect x="42" y="20" width="16" height="14" fill="#f5d6a4"/>
    <!-- Head -->
    <circle cx="50" cy="10" r="20" fill="#f5d6a4"/>
    <!-- Hair tied back -->
    <path d="M30 5 Q50 -16 70 5 Q72 18 65 25 Q50 -6 35 25 Q28 18 30 5 Z" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M44 16 Q50 20 56 16" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="44" cy="8" r="1.5" fill="#0f172a"/>
    <circle cx="56" cy="8" r="1.5" fill="#0f172a"/>
    <!-- Arms reaching forward to receive box -->
    <path d="M16 40 Q-12 55 -38 70 L-38 90 Q-12 75 16 60 Z" fill="#dc2626"/>
    <path d="M84 40 Q70 60 76 90 L92 90 Q88 60 92 50 Z" fill="#dc2626"/>
    <!-- Hands -->
    <circle cx="-40" cy="80" r="8" fill="#f5d6a4"/>
    <circle cx="86" cy="92" r="7" fill="#f5d6a4"/>
  </g>

  <!-- Child standing next to mother -->
  <g transform="translate(1020, 950)">
    <ellipse cx="35" cy="130" rx="42" ry="6" fill="#000000" opacity="0.25"/>
    <!-- Legs -->
    <rect x="22" y="60" width="10" height="70" fill="#0f172a" rx="3"/>
    <rect x="38" y="60" width="10" height="70" fill="#0f172a" rx="3"/>
    <!-- Shoes -->
    <ellipse cx="27" cy="130" rx="8" ry="4" fill="#1e293b"/>
    <ellipse cx="43" cy="130" rx="8" ry="4" fill="#1e293b"/>
    <!-- Torso (yellow shirt) -->
    <path d="M10 14 L60 14 L66 70 L4 70 Z" fill="#fbbf24"/>
    <!-- Neck -->
    <rect x="29" y="6" width="12" height="10" fill="#f5d6a4"/>
    <!-- Head -->
    <circle cx="35" cy="0" r="14" fill="#f5d6a4"/>
    <!-- Hair -->
    <path d="M21 -4 Q35 -18 49 -4 L49 -8 Q35 -14 21 -8 Z" fill="#0f172a"/>
    <!-- Smile -->
    <path d="M30 6 Q35 10 40 6" stroke="#92400e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="30" cy="-2" r="1.5" fill="#0f172a"/>
    <circle cx="40" cy="-2" r="1.5" fill="#0f172a"/>
    <!-- Arms (small wave) -->
    <path d="M10 20 Q-4 36 -2 56 L8 56 Q8 36 16 28 Z" fill="#fbbf24"/>
    <path d="M60 20 Q70 30 68 50 L60 50 Q60 36 56 28 Z" fill="#fbbf24"/>
  </g>

  <!-- Subtle warm light spotlight on the building -->
  <radialGradient id="spot" cx="0.5" cy="0.7" r="0.5">
    <stop offset="0" stop-color="#fef3c7" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#fef3c7" stop-opacity="0"/>
  </radialGradient>
  <ellipse cx="800" cy="700" rx="320" ry="240" fill="url(#spot)"/>

  <!-- Foreground vignette for readability on top of overlay -->
  <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
  </radialGradient>
  <rect width="1600" height="1200" fill="url(#vignette)"/>
</svg>
